<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header>
  <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
  <p class="tagline">{{ site.description }}{% if site.author.location %} &middot; {{ site.author.location }}{% endif %}</p>
</header>

<hr>

<main>
{% if page.title and page.url != "/" %}<h2>{{ page.title }}</h2>{% endif %}
{{ content }}
</main>

<hr>

<footer>
<p>
{% for link in site.links %}<a href="{{ link.url }}"{% if link.rel %} rel="{{ link.rel }}"{% endif %}>{{ link.label }}</a>{% unless forloop.last %} &middot; {% endunless %}{% endfor %}
</p>
</footer>

</body>
</html>
