# Minimal Jekyll config. No theme gem, no plugins — the layout and stylesheet
# in this repo are the whole "theme", so what GitHub Pages builds is what you
# see locally.

title: Patrik Eriksson
description: "Open source, mostly cameras and music."
url: "https://tiramisioux.github.io"
baseurl: ""
lang: en

author:
  name: "Patrik Eriksson"

# Shown as the small link row under the heading.
links:
  - label: "GitHub"
    url: "https://github.com/tiramisioux"
  - label: "Mastodon"
    url: "https://mastodon.social/@tiramisioux"
    rel: "me"
  - label: "Instagram"
    url: "https://instagram.com/patrikerikssonfilm"

# A new file needs nothing but a title in its front matter: the layout and the
# URL both come from here.
#   about.md                        ->  /about/
#   _posts/2026-09-15-a-thing.md    ->  /2026/09/15/a-thing/
permalink: pretty

defaults:
  - scope: {path: ""}
    values: {layout: default}
  - scope: {path: "", type: posts}
    values: {layout: post}

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
  - .bundle/
